<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Привет, Виталик!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Экран загрузки */
    #loader-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f0c29;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease-in-out;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 1.2rem;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Основной контент */
    #main-content {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(to right, #e94560, #ff9f1c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    p {
      font-size: 1.2rem;
      color: #cddcde;
      margin-top: 15px;
    }

    /* Класс для скрытия экрана загрузки */
    #loader-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Анимация появления контента */
    #main-content.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loader-screen">
    <div class="spinner"></div>
    <span class="loader-text">Загрузка...</span>
  </div>

  <!-- Основной контент -->
  <div id="main-content">
    <h1>Привет, Виталик!</h1>
    <p>Добро пожаловать на мой простой сайт.</p>
  </div>

  <script>
    const loaderScreen = document.getElementById('loader-screen');
    const mainContent = document.getElementById('main-content');

    // Имитация загрузки (например, подгрузка данных)
    setTimeout(() => {
      loaderScreen.classList.add('hidden');
      
      // Небольшая задержка, чтобы анимация opacity успела проиграться
      setTimeout(() => {
        mainContent.classList.add('visible');
      }, 800);
    }, 2500); // Время загрузки — 2.5 секунды
  </script>
</body>
</html>
